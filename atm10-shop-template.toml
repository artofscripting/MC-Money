#Shop Configuration
[shop]
	#Multiplier for sell prices. Sell price = Buy price * this value.
	#Default is 0.5 (50% of buy price)
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	sellPriceMultiplier = 0.5
	
	#Maximum number of items sold per tick by the Personal Seller block.
	#Higher values mean faster selling but more server load.
	#Default is 1 item per tick (20 items per second).
	# Default: 1
	# Range: 1 ~ 64
	personalSellerMaxItems = 64
	
	#List of items to sell in the shop.
	#Format: 'minecraft:item_id,price,display_name'
